[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-cost-sentinel"
version = "0.1.0"
description = "AWS Infrastructure Cost Analyzer with Optimization Recommendations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Praneeth Turlapati", email = "praneeth1691@gmail.com" }
]
keywords = [
    "aws",
    "cost-optimization",
    "finops",
    "cloud-costs",
    "infrastructure",
    "devops",
    "terraform",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.28.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "moto>=4.0.0",
]

[project.scripts]
sentinel = "infra_cost_sentinel.cli:app"

[project.urls]
Homepage = "https://github.com/praneethturlapati/infra-cost-sentinel"
Repository = "https://github.com/praneethturlapati/infra-cost-sentinel"
Issues = "https://github.com/praneethturlapati/infra-cost-sentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_cost_sentinel"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=infra_cost_sentinel"
